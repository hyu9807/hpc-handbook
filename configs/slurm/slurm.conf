# ==================================================
# Ye Lab HPC - Node01
# Phase: Single-node Slurm prototype
# ==================================================

ClusterName=yelab
SlurmctldHost=yelab-node01
SlurmUser=slurm

# Authentication
AuthType=auth/munge
CredType=cred/munge

# Controller and compute services
SlurmctldPort=6817
SlurmdPort=6818

StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd

# Scheduling
MpiDefault=none
ProctrackType=proctrack/cgroup
TaskPlugin=task/affinity,task/cgroup
ReturnToService=2

SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_CPU_Memory
GresTypes=gpu

# Node01 resource allocation
# Initial 8-core prototype; CPU binding not yet verified
NodeName=yelab-node01 CPUs=8 Sockets=1 CoresPerSocket=8 ThreadsPerCore=1 RealMemory=16000 State=UNKNOWN Gres=gpu:1

# Initial partition
PartitionName=debug Nodes=yelab-node01 Default=YES MaxTime=01:00:00 State=UP
